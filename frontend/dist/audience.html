<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投影用</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}body{display:flex;flex-direction:column}#audience-titlebar{height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;padding-left:10px;background:#f4f6f7;color:#2e3d49;border-bottom:1px solid #dce3e8;font:12px "Segoe UI","Yu Gothic",Meiryo,sans-serif;box-sizing:border-box;--wails-draggable:drag;user-select:none}#audience-window-controls{height:30px;display:flex;--wails-draggable:no-drag}#audience-window-controls button{width:38px;height:30px;padding:0;border:0;border-radius:0;background:transparent;color:inherit;font:16px "Segoe UI",sans-serif}#audience-window-controls button:hover{background:#dce5eb}#audience-close:hover{background:#b84242!important;color:white}#audience-content{position:relative;flex:1;min-height:0}iframe{display:block;width:100%;height:100%;border:0}#connection{position:absolute;inset:0;display:grid;place-items:center;font:20px sans-serif;background:white;color:#25334a}#connection[hidden]{display:none}body.fullscreen #audience-titlebar{display:none}</style></head><body><header id="audience-titlebar"><span>HatoNote — 投影用</span><div id="audience-window-controls" aria-label="ウィンドウ操作"><button id="audience-minimise" type="button" title="最小化" aria-label="最小化">−</button><button id="audience-maximise" type="button" title="最大化／元に戻す" aria-label="最大化／元に戻す">□</button><button id="audience-close" type="button" title="閉じる" aria-label="閉じる">×</button></div></header><main id="audience-content"><iframe id="audience-frame" title="投影スライド" src="slide-frame.html" sandbox="allow-scripts allow-same-origin"></iframe><div id="connection">発表者側に接続しています…</div></main><script type="module" src="audience.js"></script></body></html>
